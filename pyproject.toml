[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fintrack"
version = "0.1.0"
description = "Analyse bank transactions: detect recurring payments, forecast balances and give savings advice."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FinTrack Contributors" }]
keywords = ["finance", "transactions", "forecast", "budgeting", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]


[project.scripts]
fintrack = "fintrack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fintrack"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
